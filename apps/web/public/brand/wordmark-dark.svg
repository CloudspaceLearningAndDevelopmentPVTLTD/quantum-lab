<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72" role="img" aria-label="Qubit16">
  <title>Qubit16</title>
  <!-- Horizontal lockup for DARK backgrounds: the Bloch-sphere mark from app/icon.svg at 64px, then the name with the 16 in the brand violet. Static per theme on purpose; most wordmark consumers do not evaluate CSS. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1120"/><stop offset="1" stop-color="#07090f"/></linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#7c6af9" stop-opacity="0.55"/><stop offset="0.55" stop-color="#7c6af9" stop-opacity="0.16"/><stop offset="1" stop-color="#7c6af9" stop-opacity="0.04"/></radialGradient>
  </defs>
  <g transform="translate(4 4) scale(0.125)">
    <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#plate)"/>
    <rect x="16" y="16" width="480" height="480" rx="100" ry="100" fill="none" stroke="#1b2338" stroke-width="6"/>
    <circle cx="256" cy="262" r="168" fill="url(#glass)"/>
    <circle cx="256" cy="262" r="168" fill="none" stroke="#c4baff" stroke-opacity="0.55" stroke-width="7"/>
    <path d="M 88 262 A 168 52 0 0 1 424 262" fill="none" stroke="#3bbfaa" stroke-opacity="0.35" stroke-width="7"/>
    <path d="M 88 262 A 168 52 0 0 0 424 262" fill="none" stroke="#3bbfaa" stroke-width="9" stroke-linecap="round"/>
    <line x1="256" y1="94" x2="256" y2="430" stroke="#8fa3c8" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    <line x1="256" y1="262" x2="356" y2="164" stroke="#07090f" stroke-width="30" stroke-linecap="round"/>
    <line x1="256" y1="262" x2="356" y2="164" stroke="#7c6af9" stroke-width="18" stroke-linecap="round"/>
    <circle cx="256" cy="262" r="16" fill="#c4baff"/>
    <circle cx="366" cy="154" r="26" fill="#f5a623"/>
    <circle cx="366" cy="154" r="26" fill="none" stroke="#07090f" stroke-width="6"/>
  </g>
  <text x="86" y="47" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8" fill="#eef2ff">Qubit<tspan fill="#7c6af9">16</tspan></text>
</svg>
