# Quantum Lab — Cloud Build: all three images in one submit.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD),_NEXT_PUBLIC_APP_URL=https://your-domain.example,_NEXT_PUBLIC_API_URL=https://api-....run.app
#
# Companion prose: docs/DEPLOYMENT-GCP.md. Read it first — in particular the
# ordering constraint (deploy api + agent BEFORE building web, because the
# web image freezes their URLs at compile time), and the [UNVERIFIED] banner:
# no gcloud and no Docker daemon exist in the container this file was written
# in, so this build has never executed. What HAS been verified, by reading:
# every Dockerfile referenced below exists at the stated path, each one's COPY
# sources exist in its build context, and the context/-f pairing matches what
# docker-compose.yml already uses (web builds from the REPO ROOT because
# apps/web is an npm workspace and the only package-lock.json lives at the
# root — see the header of apps/web/Dockerfile).
#
# THREE DIFFERENT BUILD CONTEXTS, ON PURPOSE:
#   web   → context "."                (root lockfile; root .dockerignore applies)
#   api   → context "services/api"     (its own .dockerignore applies)
#   agent → context "services/agent"   (its own .dockerignore applies)
# Docker reads <context>/.dockerignore, so each context keeps its own ignore
# file. Do not "simplify" the Python services to a root context: their
# Dockerfiles COPY `app`/`agent`/`data` relative to the service directory.
#
# WHAT GETS UPLOADED: `gcloud builds submit` honours .gcloudignore (one is
# committed at the repo root; it includes .gitignore), NOT .dockerignore.
# .dockerignore only filters the docker-build steps below once the source is
# already in the workspace. Both matter; neither replaces the other.
#
# SECRETS: none belong here. The five _NEXT_PUBLIC_* substitutions are
# compile-time-inlined, browser-visible values — that is why they can be plain
# build args (see "Build-time configuration" in apps/web/Dockerfile). Every
# actual secret is injected at RUN time via `gcloud run deploy
# --set-secrets/--set-env-vars`, never at build time.

steps:
  # ── web ──────────────────────────────────────────────────────────────────
  # Heaviest step (npm ci + next build), started first and in parallel with
  # the others (waitFor: ['-'] = depend on nothing).
  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - --build-arg
      - NEXT_PUBLIC_SENTRY_DSN=${_NEXT_PUBLIC_SENTRY_DSN}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${_TAG}
      - .

  # ── api ──────────────────────────────────────────────────────────────────
  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${_TAG}
      - services/api

  # ── agent ────────────────────────────────────────────────────────────────
  - id: build-agent
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/agent:${_TAG}
      - services/agent

# Listing them here makes Cloud Build push all three after the steps succeed
# and record their digests in the build result — no explicit push steps needed.
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/agent:${_TAG}

substitutions:
  _REGION: us-central1
  _REPO: quantum-lab
  # Tag with the short git sha when submitting (see the command at the top);
  # 'manual' is only the fallback so an argument-less submit still works.
  _TAG: manual
  # Compile-time, browser-visible values — NOT secrets (see header). Empty
  # defaults keep the repo's "builds with no configuration" property: an
  # argument-less submit produces a working image whose extras are off.
  _NEXT_PUBLIC_APP_URL: ''
  _NEXT_PUBLIC_API_URL: ''
  _NEXT_PUBLIC_SUPABASE_URL: ''
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
  _NEXT_PUBLIC_SENTRY_DSN: ''

options:
  # npm ci + next build for web, and two pip installs of qiskit/aer/pennylane,
  # all in parallel — the default 1-vCPU machine would serialize on CPU.
  machineType: E2_HIGHCPU_8
  # Empty-string substitutions above trip the strict checker without this.
  substitutionOption: ALLOW_LOOSE

# Generous: a cold web build (no cache) plus the Python wheels can pass 20
# minutes on a bad day; the default 600s would kill a build that was going to
# succeed.
timeout: 2400s
